<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mammal Classifier</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2e38;
    --accent: #6ee7b7;
    --text: #e5e7eb;
    --muted: #9aa1ac;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 560px;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 24px;
  }
  .config {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .config label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .config input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #0d0f13;
    color: var(--text);
    font-size: 0.85rem;
    margin-bottom: 12px;
  }
  .config input[type="number"] {
    width: 80px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #0d0f13;
    color: var(--text);
  }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 30px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    background: var(--card);
  }
  .dropzone.dragover {
    border-color: var(--accent);
    background: #1c2b25;
  }
  .dropzone p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  #fileInput { display: none; }
  #preview {
    max-width: 100%;
    max-height: 260px;
    border-radius: 10px;
    margin-top: 16px;
    display: none;
  }
  #status {
    margin-top: 14px;
    font-size: 0.85rem;
    color: var(--muted);
    min-height: 20px;
  }
  #status.error { color: #f87171; }
  #results {
    margin-top: 20px;
    display: none;
  }
  .result-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .result-label {
    width: 130px;
    font-size: 0.85rem;
    flex-shrink: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-track {
    flex: 1;
    background: var(--border);
    border-radius: 6px;
    height: 10px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 6px;
    transition: width 0.4s ease;
  }
  .result-pct {
    width: 54px;
    text-align: right;
    font-size: 0.8rem;
    color: var(--muted);
    flex-shrink: 0;
  }
  .result-row.top .result-label { color: var(--accent); font-weight: 600; }
  .result-row.top .bar-fill { background: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <h1>Mammal Classifier</h1>
  <p class="subtitle">Browser version of predict.py — runs the exported Teachable Machine model with TensorFlow.js.</p>

  <div class="config">
    <label for="modelUrl">Model folder URL (must contain model.json, metadata.json, weights.bin)</label>
    <input type="text" id="modelUrl" placeholder="https://example.com/my_model/" value="./my_model/">
    <label for="topK">Top-K results</label>
    <input type="number" id="topK" min="1" value="3">
  </div>

  <div class="dropzone" id="dropzone">
    <p><strong>Click to choose an image</strong> or drag and drop it here</p>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <img id="preview" alt="preview">
  <div id="status"></div>
  <div id="results"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
<script>
(function () {
  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("fileInput");
  const preview = document.getElementById("preview");
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");
  const modelUrlInput = document.getElementById("modelUrl");
  const topKInput = document.getElementById("topK");

  let model = null;
  let loadedModelUrl = null;

  function setStatus(message, isError) {
    statusEl.textContent = message || "";
    statusEl.classList.toggle("error", Boolean(isError));
  }

  function normalizeModelUrl(rawUrl) {
    let url = rawUrl.trim();
    if (!url.endsWith("/")) url += "/";
    return url;
  }

  async function ensureModelLoaded() {
    const url = normalizeModelUrl(modelUrlInput.value);
    if (model && loadedModelUrl === url) return model;

    setStatus("Loading model...");
    const modelJsonUrl = url + "model.json";
    const metadataJsonUrl = url + "metadata.json";

    try {
      model = await tmImage.load(modelJsonUrl, metadataJsonUrl);
      loadedModelUrl = url;
      setStatus("Model loaded. Ready to classify.");
      return model;
    } catch (error) {
      model = null;
      loadedModelUrl = null;
      throw new Error(
        "Could not load model from " + url +
        " (expected model.json and metadata.json there). " + error.message
      );
    }
  }

  function renderResults(predictions, topK) {
    const sorted = predictions.slice().sort((a, b) => b.probability - a.probability);
    const top = sorted.slice(0, topK);

    resultsEl.innerHTML = "";
    top.forEach((prediction, index) => {
      const pct = (prediction.probability * 100).toFixed(2);
      const row = document.createElement("div");
      row.className = "result-row" + (index === 0 ? " top" : "");
      row.innerHTML =
        '<div class="result-label" title="' + prediction.className + '">' + prediction.className + "</div>" +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="result-pct">' + pct + "%</div>";
      resultsEl.appendChild(row);
    });
    resultsEl.style.display = "block";
  }

  async function classifyImage(imageElement) {
    const topK = Math.max(1, parseInt(topKInput.value, 10) || 3);
    try {
      const loadedModel = await ensureModelLoaded();
      setStatus("Classifying...");
      const predictions = await loadedModel.predict(imageElement);
      renderResults(predictions, Math.min(topK, predictions.length));
      const best = predictions.slice().sort((a, b) => b.probability - a.probability)[0];
      setStatus(
        "Prediction: " + best.className +
        " (" + (best.probability * 100).toFixed(2) + "% confidence)"
      );
    } catch (error) {
      setStatus(error.message, true);
      resultsEl.style.display = "none";
    }
  }

  function handleFile(file) {
    if (!file || !file.type.startsWith("image/")) {
      setStatus("Please choose an image file.", true);
      return;
    }
    const reader = new FileReader();
    reader.onload = function (event) {
      preview.src = event.target.result;
      preview.style.display = "block";
      preview.onload = function () {
        classifyImage(preview);
      };
    };
    reader.onerror = function () {
      setStatus("Could not read the selected file.", true);
    };
    reader.readAsDataURL(file);
  }

  dropzone.addEventListener("click", function () {
    fileInput.click();
  });

  fileInput.addEventListener("change", function (event) {
    if (event.target.files && event.target.files[0]) {
      handleFile(event.target.files[0]);
    }
  });

  ["dragenter", "dragover"].forEach(function (eventName) {
    dropzone.addEventListener(eventName, function (event) {
      event.preventDefault();
      event.stopPropagation();
      dropzone.classList.add("dragover");
    });
  });

  ["dragleave", "drop"].forEach(function (eventName) {
    dropzone.addEventListener(eventName, function (event) {
      event.preventDefault();
      event.stopPropagation();
      dropzone.classList.remove("dragover");
    });
  });

  dropzone.addEventListener("drop", function (event) {
    const file = event.dataTransfer.files && event.dataTransfer.files[0];
    handleFile(file);
  });
})();
</script>
</body>
</html>
